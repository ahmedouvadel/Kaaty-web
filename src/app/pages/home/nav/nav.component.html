<header class="bg-white shadow-md hidden md:block">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <a href="/" class="text-2xl font-serif text-blue-600" i18n >{{title}}</a>
      <nav class="space-x-6">
        <a routerLink="/" class="text-gray-600 hover:text-blue-600" i18n="@@home-link">Accueil</a>
        <a routerLink="/reservation" class="text-gray-600 hover:text-blue-600" i18n="@@reservation-link">Réservation</a>
        <a routerLink="/cameraman" class="text-gray-600 hover:text-blue-600" i18n="@@cameraman-link">Cameraman</a>
        <a routerLink="/buvettes" class="text-gray-600 hover:text-blue-600" i18n="@@buvettes-link">Buvettes</a>
        <a routerLink="/cadeaux" class="text-gray-600 hover:text-blue-600" i18n="@@cadeaux-link">Cadeaux</a>
        <a routerLink="/entreprises" class="text-gray-600 hover:text-blue-600" i18n="@@entreprises-link">Accès Entreprises</a>
        <a routerLink="/login" class="text-gray-600 hover:text-blue-600" i18n="@@login-link">Connexion</a>
        <a routerLink="/register" class="text-gray-600 hover:text-blue-600" i18n="@@register-link">Inscription</a>
      </nav>
      <div class="space-x-4">
        <button (click)="changeLanguage($event, 'ar')" class="text-gray-600 hover:text-blue-600" i18n="@@lang-ar">AR</button>
        <button (click)="changeLanguage($event, 'en')" class="text-gray-600 hover:text-blue-600" i18n="@@lang-en">EN</button>
        <button (click)="changeLanguage($event, 'fr')" class="text-gray-600 hover:text-blue-600" i18n="@@lang-fr">FR</button>
      </div>
    </div>
  </div>
</header>

<!-- Header pour Mobile avec Drawer -->
<header class="bg-white shadow-md md:hidden">
  <div class="flex justify-between items-center h-16 px-4">
    <a href="/" class="text-2xl font-bold text-blue-600" i18n="@@title-page">{{title}}</a>
    <button (click)="toggleDrawer()" class="text-gray-600">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <!-- Mobile Drawer -->
  <div *ngIf="isDrawerOpen" 
       class="fixed inset-0 bg-gray-600 bg-opacity-50 z-40"
       (click)="toggleDrawer()">
  </div>
  <div [class.translate-x-0]="isDrawerOpen"
       [class.translate-x-full]="!isDrawerOpen"
       class="fixed top-0 right-0 h-full w-64 bg-white shadow-lg transform transition-transform duration-300 ease-in-out z-50">
    <div class="p-4">
      <div class="flex justify-between items-center mb-8">
        <span class="text-xl font-bold text-blue-600" i18n="@@menu-title">Menu</span>
        <button (click)="toggleDrawer()" class="text-gray-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <nav class="flex flex-col space-y-4">
        <a routerLink="/" class="text-gray-600 hover:text-blue-600 py-2" i18n="@@home-link">Accueil</a>
        <a routerLink="/reservation" class="text-gray-600 hover:text-blue-600 py-2" i18n="@@reservation-link">Réservation</a>
        <a routerLink="/cameraman" class="text-gray-600 hover:text-blue-600 py-2" i18n="@@cameraman-link">Cameraman</a>
        <a routerLink="/buvettes" class="text-gray-600 hover:text-blue-600 py-2" i18n="@@buvettes-link">Buvettes</a>
        <a routerLink="/cadeaux" class="text-gray-600 hover:text-blue-600 py-2" i18n="@@cadeaux-link">Cadeaux</a>
        <a routerLink="/entreprises" class="text-gray-600 hover:text-blue-600 py-2" i18n="@@entreprises-link">Accès Entreprises</a>
        <a routerLink="/login" class="text-gray-600 hover:text-blue-600 py-2" i18n="@@login-link">Connexion</a>
        <a routerLink="/register" class="text-gray-600 hover:text-blue-600 py-2" i18n="@@register-link">Inscription</a>
      </nav>
      <div class="space-x-4">
        <button (click)="changeLanguage($event, 'ar')" class="text-gray-600 hover:text-blue-600" i18n="@@lang-ar">AR</button>
        <button (click)="changeLanguage($event, 'en')" class="text-gray-600 hover:text-blue-600" i18n="@@lang-en">EN</button>
        <button (click)="changeLanguage($event, 'fr')" class="text-gray-600 hover:text-blue-600" i18n="@@lang-fr">FR</button>
      </div>
    </div>
  </div>
</header>
